<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳美食探店 | 分享好吃的</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #fff8ee;
            color: #333;
            line-height: 1.6;
        }
        header {
            background-color: #f27c38;
            color: white;
            padding: 24px;
            text-align: center;
        }
        nav {
            background: #ffffff;
            padding:14px;
            text-align:center;
            box-shadow: 0 2px 6px #00000015;
        }
        nav a {
            text-decoration: none;
            color:#444;
            margin:0 12px;
            font-weight:500;
        }
        nav a:hover {
            color:#f27c38;
        }
        .container {
            max-width:1100px;
            margin:30px auto;
            padding:0 20px;
        }
        .intro {
            text-align:center;
            margin-bottom:40px;
        }
        .intro h2 {
            color:#f27c38;
            margin-bottom:10px;
        }
        .card-wrap {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap:24px;
        }
        .food-card {
            background:white;
            border-radius:16px;
            overflow:hidden;
            box-shadow:0 3px 10px #00000012;
        }
        .card-img {
            height:180px;
            background:#f7d9c4;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#999;
        }
        .card-text {
            padding:16px;
        }
        .card-text h3 {
            margin-bottom:6px;
        }
        .tag {
            display:inline-block;
            background:#ffe9da;
            color:#f27c38;
            padding:3px 8px;
            border-radius:8px;
            font-size:13px;
            margin:4px 2px;
        }
        footer {
            text-align:center;
            padding:30px;
            margin-top:50px;
            color:#777;
            font-size:14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>深圳美食探店笔记</h1>
        <p>走遍深圳，寻找好吃的小店｜福田｜南山｜罗湖｜宝安</p>
    </header>
    <nav>
        <a href="#">首页</a>
        <a href="#">按区域</a>
        <a href="#">按品类</a>
        <a href="#">关于我</a>
    </nav>
    <div class="container">
        <div class="intro">
            <h2>近期推荐</h2>
            <p>收集深圳值得一试的美食，含人均、地址、真实口味评价</p>
        </div>
        <div class="card-wrap">
         <div class="food-card">
   <img class="card-img" src="https://raw.githubusercontent.com/bbsonce/shenzhenfood/main/101.jpg" alt="老朱家潮汕牛肉粿条">

 <div class="card-text">
        <h3>老朱家潮汕牛肉</h3>
        <span class="tag">坪山区</span>
        <span class="tag">牛肉粿条</span>
        <p>人均：25元</p>
        <p>牛肉拌/汤粿条，平价潮汕味，坪山区老店</p>
    </div>
</div>
<div class="food-card">
    <img class="card-img" src="https://github.com/bbsonce/shenzhenfood/blob/main/fanlou.jpg?raw=true" alt="繁楼早茶">
    <div class="card-text">
        <h3>繁楼</h3>
        <span class="tag">福田</span>
        <span class="tag">早茶</span>
        <p>人均：65元</p>
        <p>老牌广式早茶，虾饺、红米肠必点，人气很高</p>
    </div>
</div>

           
            <div class="food-card">
    <img class="card-img" src="https://github.com/bbsonce/shenzhenfood/blob/main/tangshui.jpg?raw=true" alt="广式糖水">
    <div class="card-text">
        <h3>糖水铺</h3>
        <span class="tag">罗湖</span>
        <span class="tag">糖水</span>
        <p>人均：22元</p>
        <p>传统广式糖水，料足实惠</p>
    </div>
</div>

        </div>
    </div>
    <footer>
        <p>深圳美食分享站 · 持续更新探店</p>
    </footer>
</body>
</html>
